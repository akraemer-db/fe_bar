    value: databricks-claude-sonnet-4-6
  - name: SERVING_ENDPOINT_NAME
    valueFrom: scorer
  - name: GENIE_SPACE_ID
    valueFrom: genie
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
