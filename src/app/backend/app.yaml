command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: UC_CATALOG
    value: production_forecasting_catalog
  - name: UC_SCHEMA
    value: frac_pump_pdm
  - name: LAKEBASE_ENDPOINT
    value: projects/frac-pump-pdm/branches/production/endpoints/primary
